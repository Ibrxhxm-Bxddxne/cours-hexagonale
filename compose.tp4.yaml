# TP 4, etape 6 : Trafic, Notifications et Kafka. Lancer : docker compose -f compose.tp4.yaml up --build
# (compose.yaml reste celui du cours : Qualite de l'air et Alertes.)
name: urbanhub-tp4

services:
  kafka:                                  # un seul broker, KRaft, sans ZooKeeper (comme le cours)
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"                       # depuis le poste : localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNE://:19092,EXTERNE://:9092,CONTROLEUR://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNE://kafka:19092,EXTERNE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNE:PLAINTEXT,EXTERNE:PLAINTEXT,CONTROLEUR:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLEUR
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:                          # les services attendent que le broker reponde
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  trafic:                                 # Trafic qui publie dans KAFKA (topic signalements, 3 partitions)
    build: { context: ., dockerfile: Dockerfile.trafic }
    environment:
      KAFKA_BROKERS: kafka:19092
    ports: ["8003:8003"]
    volumes: ["releves-kafka:/donnees"]
    depends_on: { kafka: { condition: service_healthy } }
    restart: on-failure

  trafic-http:                            # le MEME Trafic, branche en HTTP : pour comparer les pannes
    build: { context: ., dockerfile: Dockerfile.trafic }
    environment:
      URL_SIGNALEMENTS: http://notifications:8004/signalements
    ports: ["8013:8003"]
    volumes: ["releves-http:/donnees"]

  notifications:                          # groupe Kafka « notifications » + entree HTTP /signalements
    build: { context: ., dockerfile: Dockerfile.notifications }
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_GROUPE: notifications
    ports: ["8004:8004"]
    volumes: ["notifications:/donnees"]
    depends_on:
      kafka: { condition: service_healthy }
      trafic: { condition: service_started }   # Trafic cree le topic (3 partitions) au demarrage
    restart: on-failure

  audit:                                  # le second groupe Kafka : « audit », il lit tout, n'agit sur rien
    build: { context: ., dockerfile: Dockerfile.notifications }
    command: ["node", "urbanhub-notifications/src/audit.ts"]
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_GROUPE: audit
    depends_on:
      kafka: { condition: service_healthy }
      trafic: { condition: service_started }
    restart: on-failure

volumes:
  releves-kafka:
  releves-http:
  notifications:
